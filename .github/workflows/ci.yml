name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Node.js Tests ────────────────────────────────────────────────────────
  node-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/pdfchat-test
          JWT_SECRET: ci-test-jwt-secret
          SESSION_SECRET: ci-test-session-secret
          NODE_ENV: test

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Python Tests ─────────────────────────────────────────────────────────
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: pytest --cov=services --cov-report=term-missing tests/
        env:
          GROQ_API_KEY: fake-key-for-testing
          DEEPSEEK_API_KEY: fake-key-for-testing
          HUGGINGFACE_API_KEY: fake-key-for-testing

  # ── Docker Build Verification ────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [node-tests, python-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Verify images were created
        run: docker images | grep pdfchat
